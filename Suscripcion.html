<body>
<div class="section">
    <div class="subscribe-container">
        <h1>¡Mantente informado!</h1>
        <p>Introduce tus datos a continuación para registrarte en nuestra newsletter exclusiva y recibir novedades antes que nadie.</p>

        <form id="pageSubscribeForm" class="subscribe-form">
            <!-- Campo de Nombre (Opcional pero útil en páginas dedicadas) -->
            <div class="input-group">
                <label for="userName">Nombre completo</label>
                <input type="text" id="userName" placeholder="Tu nombre" required>
            </div>

            <!-- Campo de Email -->
            <div class="input-group">
                <label for="userEmail">Correo electrónico</label>
                <input type="email" id="userEmail" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="submit-btn">Completar Registro</button>
        </form>

        <!-- Mensajes de éxito o error -->
        <div id="statusMessage" class="response-message"></div>

        <!-- Enlace para regresar a la web principal -->
        <a href="/index" class="back-link">&larr; Volver al inicio</a>
    </div>
  </div>
    <style>
       :root {
            --fuente-logotipo: 'UnifrakturMaguntia', cursive;
        }
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            padding: 0;
          zoom:75%;
        }
      .section{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
      }
        /* --- TARJETA DE SUSCRIPCIÓN --- */
        .subscribe-container {
/*            background: #ffffff;*/
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .subscribe-container h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subscribe-container p {
            color: #7f8c8d;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* --- FORMULARIO --- */
        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #34495e;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        /* --- BOTÓN DE ENVÍO --- */
        .submit-btn {
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* --- ENLACE DE RETORNO --- */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #34495e;
            text-decoration: underline;
        }

        /* --- ESTADOS DE RESPUESTA --- */
        .response-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .response-message.success {
            display: block;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .response-message.error {
            display: block;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
    </style>
      <script src="src/components/Footer-Header/Header-Footer-main.js" defer></script>
    <!-- --- LÓGICA DE INTERACCIÓN --- -->
    <script>
        document.getElementById('pageSubscribeForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se refresque

            const nameInput = document.getElementById('userName');
            const emailInput = document.getElementById('userEmail');
            const statusMessage = document.getElementById('statusMessage');

            // Simulación de envío exitoso
            statusMessage.textContent = `¡Gracias ${nameInput.value.trim()}! Te has suscrito correctamente con el correo ${emailInput.value.trim()}.`;
            statusMessage.className = "response-message success";

            // Limpia los campos del formulario
            nameInput.value = "";
            emailInput.value = "";
        });
    </script>
