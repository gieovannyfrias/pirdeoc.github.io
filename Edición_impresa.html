    <style>
         /* --- VARIABLE Y ESTILOS EDITORIALES --- */
        :root {
              --fuente-logotipo: 'UnifrakturMaguntia', cursive;

        }
/* ==========================================
   1. Estilo Base Estilo Periódico Antiguo (Escritorio)
   ========================================== */
body {
    background-color: #f4f3ee;
    font-family: 'Times New Roman', Times, serif;
    padding: 0;
    margin: 0;
  zoom:75%;
}

.edition {
    display: flex;
    justify-content: center;
    padding-top: 150px;
    padding-left: 15px;
    padding-right: 15px;
}

.periodico-hoja {
    padding: 30px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
/*    border: 1px solid #d3c2a0;*/
    overflow: hidden; /* Vital para que la imagen ampliada no se salga */
    box-sizing: border-box;
}

.periodico-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px double #1a1a1a;
    margin-bottom: 20px;
    font-weight: bold;
}

.periodico-cabecera h1 {
    font-size: 2.5rem;
    margin: 5px 0;
    letter-spacing: 2px;
    text-align: center;
}

#diario-titular {
    font-size: 1.8rem;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.periodico-cuerpo-contenedor {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Dos columnas en escritorio */
    gap: 20px;
    line-height: 1.6;
    text-align: justify;
}

/* --- Mecanismo de la Lupa Interactiva --- */
.imagen-contenedor {
    overflow: hidden; /* Esconde el exceso de la foto al hacer zoom */
    border: 2px solid #1a1a1a;
    background: #000;
    height: max-content;
}

#imagen-prensa {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.1s ease-out; /* Suaviza el movimiento del zoom */
}

/* Estado Activo de la Lupa (Inyectado por JS) */
.ampliada #imagen-prensa {
    transform: scale(2.5); /* Factor de amplificación */
    cursor: zoom-out;
}

.periodico-hoja:not(.ampliada) #imagen-prensa {
    cursor: zoom-in;
}

.pie-foto {
    font-style: italic;
    font-size: 0.9rem;
    padding: 10px;
/*    background: #f4ecd8;*/
    margin: 0;
    border-top: 1px solid #1a1a1a;
}

/* Controles de la Interfaz */
.controles-superiores, .periodico-navegacion {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
}

button {
    padding: 10px 20px;
    font-family: sans-serif;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid #ccc;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ==========================================
   2. Adaptación para Pantallas Móviles (Media Query)
   ========================================== */
@media (max-width: 768px) {
    .edition {
        padding-top: 50px; /* Reduce el gran espacio superior en móviles */
    }

    .periodico-hoja {
        padding: 15px; /* Menos espacio interno para aprovechar la pantalla */
    }

    .periodico-cabecera {
        flex-direction: column; /* Apila fecha, título y página verticalmente */
        gap: 8px;
        padding-bottom: 10px;
    }

    .periodico-cabecera h1 {
        font-size: 1.6rem; /* Achica el logotipo principal del periódico */
        order: -1; /* Obliga al título principal a quedar siempre arriba */
    }

    #diario-fecha, #diario-pagina {
        font-size: 0.85rem;
    }

    #diario-titular {
        font-size: 1.3rem; /* Titular de la noticia más compacto */
        margin-bottom: 15px;
    }

    .periodico-cuerpo-contenedor {
        grid-template-columns: 1fr; /* Cambia de 2 columnas a 1 sola columna */
        gap: 15px;
    }
    
    /* Optimización de lectura para móviles */
    #diario-cuerpo {
        text-align: left; /* Evita espacios gigantes en blanco del justificado en pantallas angostas */
        margin: 0;
    }

    /* Ajuste de lupa para pantallas táctiles */
    .ampliada #imagen-prensa {
        transform: scale(1.8); /* Menor escala de zoom en móvil para que sea controlable con el dedo */
    }
}

    <script src="src/components/Footer-Header/Header-Footer-main.js" defer></script>

    <script>
        // 1. Índice de la noticia actual (Empezamos en la primera)
        let indiceActual = 0;

        // 2. Base de datos completa integrada directamente
        const archivoHemeroteca = [
            {
                titulo: "DECLARACIÓN INMEDIATA DEL ESTADO DE EMERGENCIA NACIONAL",
                cuerpo: "En las primeras horas de la mañana, las autoridades gubernamentales civiles confirmaron los peores presagios de los analistas fronterizos. El despliegue de las fuerzas armadas e infantería de marina ha comenzado sin demora bajo estrictas directrices de seguridad interior. Los ciudadanos de las urbes principales han reaccionado con tensa calma ante las sirenas informativas. Se ha decretado el cese preventivo de actividades comerciales no esenciales y el acuartelamiento general de las milicias de reserva. El primer mandatario emitirá un comunicado oficial por ondas radiales a la medianoche para fijar los límites de los racionamientos energéticos obligatorios en los distritos del norte del territorio nacional.",
                imagen: "https://lh3.googleusercontent.com/d/1ZKVltJP559XoWmaAtCDgkFKV_uqWAwz8=w1000",
                pie: "Fotografía registrada por los corresponsales oficiales en el frente del incidente fronterizo."
            },
            {
                titulo: "DESCUBRIMIENTO REVOLUCIONARIO EN LA MEDICINA MODERNA: PENICILINA",
                cuerpo: "Un hito científico sin precedentes se ha gestado en las salas de investigación médica de nuestra prestigiosa academia. Los ensayos de laboratorio arrojaron resultados categóricos tras aislar de forma controlada cultivos biológicos capaces de contrarrestar de raíz la propagación de infecciones bacterianas agudas. El compuesto, bautizado provisionalmente como penicilina, promete reducir drásticamente las tasas de mortalidad que han diezmado a generaciones enteras durante las campañas sanitarias invernales. El cuerpo de cirujanos mayores iniciará la producción en masa del agente en los laboratorios centrales para abastecer de inmediato la red de hospitales de campaña periféricos.",
                imagen: "https://lh3.googleusercontent.com/d/1ZKVltJP559XoWmaAtCDgkFKV_uqWAwz8=w1000",
                pie: "El equipo analítico de laboratorio supervisando el desarrollo del nuevo compuesto biológico."
            },
            {
                titulo: "GRAN APERTURA EXCLUSIVA DEL TEATRO DE LA ÓPERA CENTRAL",
                cuerpo: "La vida artística e intelectual de la metrópoli celebra hoy su máximo logro arquitectónico del último lustro. Con una asistencia masiva que colmó la capacidad del palco de honor, las luminarias principales destellaron en la gala inaugural de la temporada lírica. Las composiciones acústicas del recinto han sido elogiadas de forma unánime por los críticos más severos del continente. Trajes de etiqueta fina, sombreros de gala y las más distinguidas familias de la industria local se dieron cita en un evento que consolida nuestro prestigio cultural ante las delegaciones diplomáticas invitadas, quienes no escatimaron aplausos al concluir la función de apertura.",
                imagen: "https://lh3.googleusercontent.com/d/1ZKVltJP559XoWmaAtCDgkFKV_uqWAwz8=w1000",
                pie: "Panorámica de la fachada principal del nuevo teatro durante la llegada de las comitivas diplomáticas."
            },
            {
                titulo: "TRATADO DE PAZ FIRMADO: TERMINA DE FORMA OFICIAL EL CONFLICTO GLOBAL",
                cuerpo: "Tras seis extensos años de hostilidades ininterrumpidas que devastaron las cadenas de producción globales, las delegaciones internacionales han plasmado su rúbrica definitiva en el armisticio de paz general. Los despachos internacionales confirman el júbilo popular desatado espontáneamente en las plazas públicas del viejo continente. Los términos fijados obligan a una desmovilización total y progresiva de los ejércitos en combate. Los comités civiles de reconstrucción asumirán el control inmediato de la distribución de suministros críticos alimenticios. La paz retorna al mundo, abriendo un capítulo de cooperación comercial sin precedentes históricos.",
                imagen: "https://lh3.googleusercontent.com/d/1ZKVltJP559XoWmaAtCDgkFKV_uqWAwz8=w1000",
                pie: "Representantes diplomáticos firman el acuerdo definitivo en el Palacio de Convenciones Internacionales."
            }
        ];

        // 3. Elementos de la interfaz
        const txtTitular = document.getElementById("diario-titular");
        const txtCuerpo = document.getElementById("diario-cuerpo");
        const txtPie = document.getElementById("diario-pie");
        const imgPrensa = document.getElementById("imagen-prensa");
        const txtFecha = document.getElementById("diario-fecha");
        const txtPagina = document.getElementById("diario-pagina");

        const btnAnterior = document.getElementById("btn-anterior");
        const btnSiguiente = document.getElementById("btn-siguiente");

        // 4. Función central para actualizar la hoja impresa
        function actualizarHoja() {
            const noticia = archivoHemeroteca[indiceActual];

            // Inyectar textos e imágenes de la noticia activa
            txtTitular.textContent = noticia.titulo;
            txtCuerpo.textContent = noticia.cuerpo;
            txtPie.textContent = noticia.pie;
            imgPrensa.src = noticia.imagen;

            // Cambiar datos de cabecera estéticamente
            txtFecha.textContent = `Año LVIII — Nº 14.20${indiceActual + 1}`;
            txtPagina.textContent = `Pág. ${indiceActual + 1}`;

            // Control de encendido/apagado de botones de navegación
            btnAnterior.disabled = indiceActual === 0;
            btnSiguiente.disabled = indiceActual === archivoHemeroteca.length - 1;
        }

        // 5. Listeners de navegación entre páginas
        btnAnterior.addEventListener("click", () => {
            if (indiceActual > 0) {
                indiceActual--;
                actualizarHoja();
            }
        });

        btnSiguiente.addEventListener("click", () => {
            if (indiceActual < archivoHemeroteca.length - 1) {
                indiceActual++;
                actualizarHoja();
            }
        });

        // 6. Motor de la Lupa Interactiva
        const visor = document.getElementById("visor-lupa");
        const btnZoom = document.getElementById("btn-zoom");

        function alternarZoom() {
            visor.classList.toggle("ampliada");
            if (visor.classList.contains("ampliada")) {
                btnZoom.textContent = "🔍 Desactivar Lupa";
                btnZoom.style.background = "#d9534f";
                btnZoom.style.color = "#fff";
            } else {
                btnZoom.textContent = "🔍 Activar Lupa";
                btnZoom.style.background = "#fff";
                btnZoom.style.color = "#000";
            }
        }

        btnZoom.addEventListener("click", alternarZoom);
        visor.addEventListener("click", alternarZoom);

        visor.addEventListener("mousemove", (e) => {
            if (!visor.classList.contains("ampliada")) return;
            const rect = visor.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;
            imgPrensa.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        });

        visor.addEventListener("mouseleave", () => {
            imgPrensa.style.transformOrigin = "center center";
        });

        // Carga inicial al procesar el archivo
        document.addEventListener("DOMContentLoaded", actualizarHoja);
    </script>
